name: Build and Publish Docs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build HTML docs with marked
        run: |
          mkdir -p dist
          npx marked -i docs/index.md -o dist/index.html
          npx marked -i docs/lingue-namespace.md -o dist/lingue-namespace.html
          npx marked -i docs/lingue-ontology.md -o dist/lingue-ontology.html
          npx marked -i docs/lingue-protocol.md -o dist/lingue-protocol.html
          npx marked -i docs/brainstorm.md -o dist/brainstorm.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
